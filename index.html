// DELETE from lightbox (collection delete)
function deleteFromLb() {
  if (!currentId) return;
  var id = currentId;
  document.getElementById('confirmMsg').textContent = 'Delete this photo?';
  document.getElementById('confirmSub').textContent = 'It will be removed from all boards and your collection, permanently, on every device. This cannot be undone.';
  document.getElementById('confirmOkBtn').textContent = 'Delete';
  document.getElementById('confirmOkBtn').onclick = function() {
    closeConfirm();
    closeLb();
    var post = SEED_POSTS.find(function(p) { return p.id === id; });
    SEED_POSTS = SEED_POSTS.filter(function(p) { return p.id !== id; });
    var boards = getBoards();
    boards.forEach(function(b) { b.postIds = (b.postIds || []).filter(function(pid) { return pid !== id; }); });
    BOARDS = boards;
    deleteCrop(id);
    renderGrid();
    // Serialized writes — one at a time, each confirmed before the next.
    // Order matters: posts.json first (the app's source of truth). If a later
    // step fails, worst case is an invisible orphan image, never a broken thumbnail.
    syncPostsToGitHub().then(function(r) {
      if (!r.ok) throw new Error('posts.json did not save: ' + r.reason);
      return syncBoardsToGitHub();
    }).then(function(r) {
      if (!r.ok) throw new Error('boards.json did not save: ' + r.reason);
      return deleteImageFileFromGitHub(post);
    }).catch(function(e) {
      alert('DELETION DID NOT FULLY SYNC TO GITHUB.\n\n' + e.message + '\n\nThe photo is gone from this screen only — it WILL come back on reload and on other devices. Try deleting it again, or check your GitHub token in Settings.');
    });
  };
  document.getElementById('confirmModal').classList.add('open');
}

// RECROP from lightbox
function recropFromLb() {
  if (!currentId) return;
  var post = getAllPosts().find(function(p) { return p.id === currentId; });
  if (!post) return;
  var postId = currentId;
  var imgUrl = post.image;
  var src = getCrop(postId) || imgUrl;

  if (!getGhToken()) {
    if (!confirm('No GitHub token is set (Settings). Without it, this crop will only be saved on THIS device and will revert on other devices or if your cache is cleared — it will NOT permanently update the actual image file.\n\nContinue anyway?')) {
      return;
    }
  }

  // Launch crop UI directly — pass the source URL, let cropImg load it natively
  function runCropUI(srcUrl, w, h) {
    var item = { file: null, srcUrl: srcUrl, top: 0, bottom: h, w: w, h: h, skip: false };

    // Run auto-detection for suggested bounds. srcUrl is always a data:/blob: URL
    // at this point, so this never fails from CORS.
    var probe = new Image();
    probe.onload = function() {
      var pw = probe.naturalWidth, ph = probe.naturalHeight;
      var scale = Math.min(1, 600/ph);
      var sw = Math.round(pw*scale), sh = Math.round(ph*scale);
      var pc = document.createElement('canvas');
      pc.width = sw; pc.height = sh;
      try {
        pc.getContext('2d').drawImage(probe, 0, 0, sw, sh);
        var bounds = detectCropBounds(pc.getContext('2d').getImageData(0,0,sw,sh), sw, sh);
        item.top = Math.round(bounds.top / scale);
        item.bottom = Math.round(bounds.bottom / scale);
      } catch(e) { /* use full bounds */ }
      showRecropModal(item, postId, imgUrl);
    };
    probe.onerror = function() { showRecropModal(item, postId, imgUrl); };
    probe.src = srcUrl;
  }

  // Reliably resolve the image to a data: URL first (GitHub Contents API when
  // possible, otherwise fetch->blob->dataURL) — never feed a raw cross-origin
  // URL straight into the crop <img>, which is what caused intermittent
  // canvas-taint failures.
  fetchImageAsDataUrl(src).then(function(dataUrl) {
    var sizer = new Image();
    sizer.onload = function() { resetRecropBtn(); runCropUI(dataUrl, sizer.naturalWidth, sizer.naturalHeight); };
    sizer.onerror = function() { resetRecropBtn(); alert('Could not load image for cropping.'); };
    sizer.src = dataUrl;
  }).catch(function() {
    resetRecropBtn();
    alert('Could not load image for cropping. Check your connection or GitHub token in Settings.');
  });
  var recropBtn = document.getElementById('recropBtn');
  if (recropBtn) { recropBtn.textContent = 'Loading…'; recropBtn.disabled = true; }
  function resetRecropBtn() {
    if (recropBtn) { recropBtn.textContent = 'Recrop'; recropBtn.disabled = false; }
  }
}

// Show the crop modal for a recrop operation (separate from upload crop flow)
function showRecropModal(item, postId, imgUrl) {
  cropQueue = [item];
  cropResolveQueue = [function(croppedFile) {
    if (!croppedFile) {
      alert('Crop failed to save — please try again.');
      return;
    }
    var reader = new FileReader();
    reader.onload = function() {
      var dataUrl = reader.result;
      // 1. Update lightbox immediately
      if (currentId === postId) {
        document.getElementById('lbImg').src = dataUrl;
      }
      // 2. Persist locally (instant, always succeeds — this is the on-device cache)
      saveCrop(postId, dataUrl);
      // 3. Update grid cards
      document.querySelectorAll('.card').forEach(function(card) {
        if (card._postId === postId) {
          var cardImg = card.querySelector('img');
          if (cardImg) cardImg.src = dataUrl;
        }
      });
      renderGrid();

      // 4. Push to GitHub — this is what makes the crop PERMANENT (the actual
      // hosted image file, not just this device's local cache). Every step is
      // checked; failure is surfaced loudly instead of swallowed.
      var token = getGhToken();
      var recropBtn = document.getElementById('recropBtn');
      function setBtnStatus(text, ms) {
        if (!recropBtn) return;
        recropBtn.textContent = text;
        if (ms) setTimeout(function() { recropBtn.textContent = 'Recrop'; }, ms);
      }
      if (!token) {
        setBtnStatus('Saved locally only ⚠️', 3500);
        return;
      }
      var ext = imgUrl.endsWith('.png') ? 'png' : 'jpg';
      var ghPath = 'images/' + postId + '.' + ext;
      var b64 = dataUrl.split(',')[1];
      setBtnStatus('Saving permanently…');
      // Retries once on a 409 (stale sha — something else wrote to this file,
      // or landed a commit elsewhere in the repo, between our GET and PUT).
      // Safe to retry here because recrop always intends to overwrite
      // whatever is currently at this path, unlike a fresh upload.
      function pushRecrop(isRetry) {
        return fetch('https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/' + ghPath, {
          headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' },
          cache: 'no-store'
        }).then(function(r) {
          if (!r.ok) throw new Error('Could not read current file (HTTP ' + r.status + ')');
          return r.json();
        }).then(function(meta) {
          if (!meta.sha) throw new Error('No sha returned for existing file');
          return fetch('https://api.github.com/repos/' + GH_USER + '/' + GH_REPO + '/contents/' + ghPath, {
            method: 'PUT',
            headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: 'recrop ' + postId, content: b64, sha: meta.sha })
          });
        }).then(function(putRes) {
          if (!putRes.ok) {
            if (putRes.status === 409 && !isRetry) {
              return pushRecrop(true);
            }
            return putRes.json().catch(function(){ return {}; }).then(function(errBody) {
              throw new Error('GitHub rejected the save (HTTP ' + putRes.status + '): ' + (errBody.message || 'unknown error'));
            });
          }
          return putRes;
        });
      }
      pushRecrop(false).then(function() {
        setBtnStatus('Saved permanently ✓', 2000);
      }).catch(function(e) {
        console.error('recrop push failed', e);
        setBtnStatus('Recrop');
        alert('This crop is only saved on this device — pushing it permanently to GitHub failed:\n\n' + e.message + '\n\nYour local view is updated, but other devices (and a cleared cache) will still show the old crop until this succeeds. Try again, or check your GitHub token in Settings.');
      });
    };
    reader.readAsDataURL(croppedFile);
  }];
  cropQueueIndex = 0;
  showCropItem();
}

var retagPostId = null;

function retagFromLb() {
  if (!currentId) return;

      } else {
        document.getElementById('retagStatus').textContent = (lastGeminiError || 'Could not read info') + ' — fill in manually.';
      }
      document.getElementById('retagSaveBtn').disabled = false;
    }).catch(function(e) {
      document.getElementById('retagStatus').textContent = 'Could not load image (' + e.message + ') — fill in manually.';
      document.getElementById('retagSaveBtn').disabled = false;
    });
  }
}

// ── BULK RETAG: find all unknown/untagged posts and retag them ──
function bulkRetag() {
  var geminiKey = getGeminiKey();
  if (!geminiKey) { alert('Add a Gemini API key in Settings first.'); return; }
  var posts = getAllPosts().filter(function(p) {
    return p.username === 'unknown' || !p.username || (p.visual_tags || []).length === 0;
  });
  if (!posts.length) { alert('No untagged photos found.'); return; }
  if (!confirm('Re-tag ' + posts.length + ' untagged photo(s) using Gemini? This may take a while — you can leave this tab open in the background.')) return;

  var i = 0;
  var done = 0, failed = 0;
  var SYNC_EVERY = 10; // periodic checkpoint so long runs don't lose progress if interrupted
  var statusEl = document.getElementById('settingsStatus');

  function updateStatus() {
    if (statusEl) statusEl.textContent = 'Re-tagging ' + (i) + '/' + posts.length + ' (' + done + ' updated, ' + failed + ' failed)…';
  }

  function processNext() {
    if (i >= posts.length) {
      buildPills(); renderGrid();
      syncPostsToGitHub().then(function(r) {
        var msg = 'Done! ' + done + ' updated' + (failed ? ', ' + failed + ' failed.' : '.');
        if (!r.ok) msg += '\n\nFinal save did not sync permanently: ' + r.reason;
        alert(msg);
        if (statusEl) statusEl.textContent = '';
      });
      return;
    }
    var post = posts[i++];
    updateStatus();
    // Use the same CORS-safe path as recrop: fetch via GitHub Contents API (or
    // fetch->blob as fallback) instead of loading a cross-origin <img> directly,
    // which taints the canvas and silently breaks this exact feature.
    var src = getCrop(post.id) || post.image || '';
    fetchImageAsDataUrl(src).then(function(dataUrl) {
      var b64 = dataUrl.split(',')[1];
      var mime = dataUrl.match(/^data:([^;]+);/);
      return scrapePostInfo({ type: mime ? mime[1] : 'image/jpeg' }, b64);
    }).then(function(info) {
      if (info) {
        var p = SEED_POSTS.find(function(p) { return p.id === post.id; });
        if (p) {
          if (info.username && info.username !== 'null') p.username = info.username.replace(/^@/,'');
          if (info.caption && info.caption !== 'null') p.caption = info.caption;
          if (info.date && info.date !== 'null') p.post_date = info.date;
          if (info.visual_tags && info.visual_tags.length) p.visual_tags = info.visual_tags;
        }
        done++;
      } else { failed++; }
    }).catch(function(e) {
      console.warn('bulkRetag failed for', post.id, e);
      failed++;
    }).then(function() {
      if (done > 0 && done % SYNC_EVERY === 0) {
        renderGrid();
        syncPostsToGitHub().then(function(r) {
          if (!r.ok) console.warn('Checkpoint sync failed:', r.reason);
          setTimeout(processNext, 800); // pace API calls
        });
      } else {
        setTimeout(processNext, 800); // pace API calls
      }
    });
  }
  processNext();
}

// SORT MODE
var sortQueue = [];
var sortIndex = 0;

function initSort() {
  var all = getAllPosts();
  var log = getLog();
  // Bucket 1: never interacted (no log entry at all)
  var unsorted = all.filter(function(p) { return !log[p.id]; });
  // Bucket 2: opened but never boarded
  var light = all.filter(function(p) { return log[p.id] && !log[p.id].board; });
  // Bucket 3: already boarded
  var heavy = all.filter(function(p) { return log[p.id] && log[p.id].board; });
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  sortQueue = shuffle(unsorted).concat(shuffle(light)).concat(shuffle(heavy));
  sortIndex = 0;
  showSortCard();
  initSortSwipe();
}

function showSortCard() {
  var done = document.getElementById('sortDoneMsg');
  var card = document.getElementById('sortCard');
  if (sortIndex >= sortQueue.length) {
    card.style.display = 'none';
    done.style.display = 'block';
    document.getElementById('sortProgress').textContent = '';
    return;
  }
  done.style.display = 'none';
  card.style.display = '';
  card.style.transform = 'none';
  card.style.opacity = '1';
  var post = sortQueue[sortIndex];
  document.getElementById('sortImg').src = post.image || '';
  document.getElementById('sortUser').textContent = '@' + post.username;
  document.getElementById('sortCaption').textContent = post.caption || '';
  document.getElementById('sortProgress').textContent = (sortIndex + 1) + ' / ' + sortQueue.length;
}

function sortAnimateAndAdvance(dir, cb) {
  var card = document.getElementById('sortCard');
  card.style.transition = 'transform 0.28s ease, opacity 0.28s';
  card.style.transform = 'translateX(' + (dir * 120) + 'px) rotate(' + (dir * 8) + 'deg)';
  card.style.opacity = '0';
  setTimeout(function() {
    sortIndex++;
    if (cb) cb();
    showSortCard();
  }, 280);
}

function sortSkip() { sortAnimateAndAdvance(-1, null); }

function sortSave() {
  var post = sortQueue[sortIndex];
  if (!post) return;
  // Snap the card back to neutral while the picker is open (a swipe may have
  // left it half-dragged). It only animates away after Done — closing the
  // picker without Done leaves the photo exactly where it was.
  var card = document.getElementById('sortCard');
  card.style.transition = 'transform 0.2s, opacity 0.2s';
  card.style.transform = 'none';
  card.style.opacity = '1';
  openBoardPicker({
    postId: post.id,
    onDone: function() { sortAnimateAndAdvance(1, null); },
    onCancel: function() { /* photo stays put, unsaved and unskipped */ }
  });
}

function sortDelete() {
  var post = sortQueue[sortIndex];
  if (!post) return;
  var postId = post.id;
  document.getElementById('confirmMsg').textContent = 'Delete this photo?';
  document.getElementById('confirmSub').textContent = 'It will be removed from all boards and your collection, permanently, on every device.';
  document.getElementById('confirmOkBtn').textContent = 'Delete';
  document.getElementById('confirmOkBtn').onclick = function() {
    closeConfirm();
    var post = SEED_POSTS.find(function(p) { return p.id === postId; });
    SEED_POSTS = SEED_POSTS.filter(function(p) { return p.id !== postId; });
    var boards = getBoards();
    boards.forEach(function(b) { b.postIds = (b.postIds || []).filter(function(pid) { return pid !== postId; }); });
    saveBoards(boards);
    deleteCrop(postId);
    sortQueue.splice(sortIndex, 1);
    showSortCard();
    deleteImageFileFromGitHub(post);
    syncPostsToGitHub().then(function(r) {
      if (!r.ok) alert('This photo was removed here, but the deletion did not sync permanently:\n\n' + r.reason);
    });
  };
  document.getElementById('confirmModal').classList.add('open');
}

// Swipe gesture for sort mode
function initSortSwipe() {
  var card = document.getElementById('sortCard');
  var startX = 0, startY = 0, dx = 0;
  var dragging = false;
  function onStart(e) {
    if (document.getElementById('sortPage').style.display === 'none') return;
    var t = e.touches ? e.touches[0] : e;
    startX = t.clientX; startY = t.clientY; dx = 0; dragging = true;
    card.classList.add('dragging');
  }
  function onMove(e) {
    if (!dragging) return;
    var t = e.touches ? e.touches[0] : e;
    dx = t.clientX - startX;
    var dy = t.clientY - startY;
    // Swipe down gesture — track vertically, suppress horizontal handling
    if (dy > 20 && dy > Math.abs(dx)) {
      e.preventDefault();
      card.style.transform = 'translateY(' + dy + 'px) scale(' + Math.max(0.92, 1 - dy / 600) + ')';
      card.style.opacity = String(Math.max(0.4, 1 - dy / 200));
      return;
    }
    if (Math.abs(dy) > Math.abs(dx) + 10) { dragging = false; card.style.transform = 'none'; card.style.opacity = '1'; return; }
    e.preventDefault();
    var rot = dx * 0.06;
    card.style.transform = 'translateX(' + dx + 'px) rotate(' + rot + 'deg)';
    card.style.opacity = String(Math.max(0.4, 1 - Math.abs(dx) / 300));
  }
  function onEnd() {
    if (!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    var t_dy = 0;
    // Recalculate dy from last known positions isn't available here — use card transform
    var transform = card.style.transform;
    var dyMatch = transform.match(/translateY\(([0-9.]+)px\)/);
    var dy = dyMatch ? parseFloat(dyMatch[1]) : 0;
    if (dy > 80) { card.style.transition = 'transform 0.28s ease, opacity 0.28s'; card.style.transform = 'translateY(160px)'; card.style.opacity = '0'; setTimeout(function() { sortDelete(); }, 200); }
    else if (dx > 80) { sortSave(); }
    else if (dx < -80) { sortSkip(); }
    else { card.style.transition = 'transform 0.2s, opacity 0.2s'; card.style.transform = 'none'; card.style.opacity = '1'; }
  }
  card.addEventListener('touchstart', onStart, { passive: true });
  card.addEventListener('touchmove', onMove, { passive: false });
  card.addEventListener('touchend', onEnd);
  card.addEventListener('mousedown', onStart);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onEnd);
}

// ── AUTO-CENSOR ──────────────────────────────────────────────────────────────
async function detectSensitiveAreas(postId) {
  var geminiKey = getGeminiKey();
  if (!geminiKey) { alert('Add a Gemini API key in Settings to use auto-censor.'); return null; }
  var post = getAllPosts().find(function(p) { return p.id === postId; });
  if (!post || !post.image) return null;
  // Fetch image as base64
  var imgUrl = post.image.split('?')[0]; // strip cache buster for fetch
  var b64, mimeType;
  try {
    var resp = await fetch(imgUrl);
    var blob = await resp.blob();
    mimeType = blob.type || 'image/jpeg';
    b64 = await new Promise(function(res, rej) {
      var r = new FileReader();
      r.onload = function() { res(r.result.split(',')[1]); };
      r.onerror = rej;
      r.readAsDataURL(blob);
    });
  } catch(e) { alert('Could not fetch image for analysis.'); return null; }

  var prompt = `Analyse this image for sensitive content (nudity, explicit sexual content, graphic violence).
If sensitive areas exist, return bounding boxes covering them as percentages of image dimensions.
Return ONLY raw JSON, no markdown:
{"is_sensitive": true/false, "boxes": [{"x": left%, "y": top%, "w": width%, "h": height%}]}
If not sensitive, return: {"is_sensitive": false, "boxes": []}
Be conservative — only flag genuinely explicit content, not suggestive or artistic nudity in a fashion context.`;

  try {
    var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + geminiKey, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: mimeType, data: b64 } }] }],
        generationConfig: { temperature: 0.1, maxOutputTokens: 512 }
      })
    });
    var data = await res.json();
    if (!res.ok) { console.error('Gemini censor error', data); return null; }
    var txt = ((data.candidates || [])[0]?.content?.parts?.[0]?.text || '');
    txt = txt.replace(/^```json\s*/i,'').replace(/^```\s*/i,'').replace(/\s*```$/,'').trim();
    var m = txt.match(/\{[\s\S]*\}/);
    if (m) return JSON.parse(m[0]);
  } catch(e) { console.warn('detectSensitiveAreas error', e); }
  return null;
}

async function autoCensorFromLb() {
  if (!currentId) return;
  var btn = document.getElementById('lbCensorBtn');
  btn.textContent = 'Analysing…';
  btn.disabled = true;
  var result = await detectSensitiveAreas(currentId);
  btn.textContent = 'Auto-censor';
  btn.disabled = false;
  if (!result) return;
  if (!result.is_sensitive || !result.boxes || !result.boxes.length) {
    alert('No sensitive content detected in this image.');
    return;
  }
  // Preview boxes on the lightbox image
  var wrap = document.getElementById('lbImgWrap');
  var previews = [];
  result.boxes.forEach(function(box) {
    var el = document.createElement('div');
    el.className = 'lb-censor';
    el.style.cssText = 'position:absolute;left:'+box.x+'%;top:'+box.y+'%;width:'+box.w+'%;height:'+box.h+'%;background:#000;z-index:5;border:2px dashed #f00;';
    wrap.appendChild(el);
    previews.push(el);
  });
  if (!confirm('Sensitive area(s) detected and shown in red outline. Save these censor boxes?')) {
    previews.forEach(function(el) { el.remove(); });
    // Restore normal censor display
    openLb(currentId);
    return;
  }
  previews.forEach(function(el) { el.style.border = 'none'; });
  // Save to posts.json
  var post = SEED_POSTS.find(function(p) { return p.id === currentId; });
  if (post) {
    post.censor_boxes = result.boxes;
    syncPostsToGitHub().then(function(r) {
      if (!r.ok) alert('Censor boxes saved locally but failed to sync: ' + r.reason);
    });
  }
}

async function startCensorAudit() {
  var geminiKey = getGeminiKey();
  if (!geminiKey) { alert('Add a Gemini API key in Settings first.'); return; }
  var statusEl = document.getElementById('auditCensorStatus');
  var btn = document.getElementById('auditCensorBtn');
  // Only posts with no censor_boxes yet
  var toAudit = SEED_POSTS.filter(function(p) { return !p.censor_boxes || !p.censor_boxes.length; });
  if (!toAudit.length) { statusEl.textContent = 'All posts already audited.'; return; }
  btn.disabled = true;
  var flagged = 0, done = 0, total = toAudit.length;
  statusEl.textContent = 'Starting audit of ' + total + ' posts…';
  // Process in batches of 3 to avoid rate limits
  for (var i = 0; i < toAudit.length; i += 3) {
    var batch = toAudit.slice(i, i + 3);
    await Promise.all(batch.map(async function(post) {
      var result = await detectSensitiveAreas(post.id);
      done++;
      if (result && result.is_sensitive && result.boxes && result.boxes.length) {
        post.censor_boxes = result.boxes;
        flagged++;
      }
      statusEl.textContent = 'Auditing… ' + done + ' / ' + total + ' (' + flagged + ' flagged)';
    }));
    // Save incrementally every batch
    if (flagged > 0) {
      await syncPostsToGitHub();
    }
    // Small pause between batches
    await new Promise(function(r) { setTimeout(r, 800); });
  }
  btn.disabled = false;
  statusEl.textContent = 'Audit complete. ' + flagged + ' post(s) flagged and saved.';
  renderGrid();
}

// Lock screen
(function() {
  var unlocked = localStorage.getItem('lb_unlocked') === '1';
  function boot() {
    // Instant paint from whatever was cached last session...
    try {
      var cached = localStorage.getItem('lb_posts_cache');
      if (cached) SEED_POSTS = JSON.parse(cached);
    } catch(e) {}
    try {
      var cachedBoards = localStorage.getItem('lb_boards_cache') || localStorage.getItem('lb_boards');
      if (cachedBoards) BOARDS = JSON.parse(cachedBoards);
    } catch(e) {}
    buildPills(); renderGrid();
    // ...then fetch the canonical, up-to-date lists from GitHub and re-render.
    // This is what makes every device converge on the same data, the same
    // way posts 1-120 always did — now true for every post, and for boards.
    loadAllPosts().then(function() { buildPills(); renderGrid(); });
    loadAllBoards().then(function() {
      if (document.getElementById('boardsPage').style.display !== 'none') renderBoards();
    });
  }
  if (!unlocked) {
    var overlay = document.createElement('div');
    overlay.id = 'lockOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;';
    overlay.innerHTML = '<div style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:8px;">Lookbook</div>' +
      '<input id="pwInput" type="password" placeholder="password" style="border:none;border-bottom:1px solid #e8e8e8;font-size:13px;padding:6px 0;outline:none;text-align:center;width:180px;font-family:inherit;" autofocus>' +
      '<div id="pwError" style="font-size:11px;color:#999;min-height:16px;font-style:italic;"></div>';
    document.body.appendChild(overlay);
    function tryUnlock() {
      if (document.getElementById('pwInput').value === 'lookbook') {
        localStorage.setItem('lb_unlocked', '1');
        overlay.remove();
        boot();
      } else {
        document.getElementById('pwError').textContent = 'incorrect';
        document.getElementById('pwInput').value = '';
      }
    }
    document.getElementById('pwInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') tryUnlock(); });
    overlay.addEventListener('click', function(e) { if (e.target === overlay) tryUnlock(); });
  } else {
    boot();
  }
})();

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}
