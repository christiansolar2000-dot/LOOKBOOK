<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lookbook</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #fff; --ink: #111; --muted: #999; --faint: #e8e8e8; --chip: #f2f2f2;
  --f: 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
html { scroll-behavior: smooth; }
body { background: var(--bg); font-family: var(--f); color: var(--ink); min-height: 100vh; }

nav {
  position: sticky; top: 0; z-index: 300;
  background: #fff; border-bottom: 1px solid var(--faint);
  height: 48px; display: flex; align-items: center; padding: 0 20px; gap: 0;
}
.nav-logo {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink); font-weight: 500; margin-right: auto; cursor: pointer;
  user-select: none;
}
.nav-tab {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--muted); background: none; border: none; cursor: pointer;
  padding: 0 16px; height: 48px; transition: color 0.15s; font-family: var(--f);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.nav-tab.active { color: var(--ink); border-bottom-color: var(--ink); }
.nav-tab:hover { color: var(--ink); }
.nav-add {
  font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--ink); background: none; border: 1px solid var(--ink);
  cursor: pointer; padding: 6px 14px; margin-left: 16px;
  transition: all 0.15s; font-family: var(--f);
}
.nav-add:hover { background: var(--ink); color: #fff; }

#explorePage { display: block; }
#boardsPage { display: none; }

.explore-header { padding: 20px 20px 0; display: flex; align-items: center; gap: 12px; }
#searchInput {
  flex: 1; min-width: 200px; max-width: 400px;
  border: none; border-bottom: 1px solid var(--faint);
  font-size: 13px; font-family: var(--f); color: var(--ink);
  padding: 6px 0; outline: none; background: transparent; transition: border-color 0.2s;
}
#searchInput:focus { border-bottom-color: var(--ink); }
#searchInput::placeholder { color: var(--muted); }

.filter-pills { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 20px 0; }
.pill {
  font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 5px 12px; border: 1px solid var(--faint);
  background: transparent; color: var(--muted); cursor: pointer;
  transition: all 0.15s; font-family: var(--f); white-space: nowrap;
}
.pill:hover { border-color: var(--muted); color: var(--ink); }
.pill.active { background: var(--ink); color: #fff; border-color: var(--ink); }

.grid { padding: 16px 20px; columns: 5 180px; column-gap: 8px; }
.card {
  break-inside: avoid; margin-bottom: 8px; cursor: pointer;
  position: relative; overflow: hidden; background: var(--faint);
}
.card img { width: 100%; display: block; transition: opacity 0.2s; }
.card:hover img { opacity: 0.88; }
.card-label {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,0.92); padding: 6px 8px;
  font-size: 10px; color: var(--muted); opacity: 0; transition: opacity 0.2s;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.card:hover .card-label { opacity: 1; }
.empty { display: none; text-align: center; padding: 100px 20px; color: var(--muted); font-size: 13px; }
.empty.show { display: block; }

/* LIGHTBOX */
.lb { display: none; position: fixed; inset: 0; background: #fff; z-index: 500; overflow-y: auto; }
.lb.open { display: block; }
.lb-inner { max-width: 800px; margin: 0 auto; padding-bottom: 80px; }
.lb-close {
  position: fixed; top: 14px; right: 20px; font-size: 22px;
  background: none; border: none; color: var(--muted); cursor: pointer; z-index: 10;
}
.lb-close:hover { color: var(--ink); }
.lb-img-wrap { position: relative; }
.lb-img { width: 100%; display: block; }
.lb-meta {
  padding: 20px 24px 16px; border-bottom: 1px solid var(--faint);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 20px;
}
.lb-user {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 4px; cursor: pointer; display: inline-block; transition: color 0.15s;
}
.lb-user:hover { color: var(--ink); }
.lb-caption { font-size: 16px; color: var(--ink); line-height: 1.4; margin-bottom: 4px; }
.lb-date { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.lb-tags { display: flex; flex-wrap: wrap; gap: 4px; max-width: 220px; justify-content: flex-end; }
.lb-tag {
  font-size: 10px; padding: 3px 9px; background: var(--chip);
  color: var(--muted); cursor: pointer; border: none; font-family: var(--f);
  transition: all 0.15s;
}
.lb-tag:hover { background: var(--ink); color: #fff; }
.lb-notes-wrap { padding: 12px 24px; border-bottom: 1px solid var(--faint); }
.lb-notes {
  width: 100%; border: none; border-bottom: 1px solid var(--faint);
  font-size: 12px; font-family: var(--f); color: var(--muted);
  padding: 4px 0; outline: none; background: transparent; font-style: italic;
}
.lb-notes:focus { color: var(--ink); border-bottom-color: var(--ink); }
.lb-notes::placeholder { color: #ccc; }
.lb-board-btn {
  display: inline-block; margin: 12px 24px 0;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  background: none; border: 1px solid var(--faint); color: var(--muted);
  padding: 6px 14px; cursor: pointer; font-family: var(--f); transition: all 0.15s;
}
.lb-board-btn:hover { border-color: var(--ink); color: var(--ink); }
.lb-section { padding: 16px 24px 0; border-top: 1px solid var(--faint); margin-top: 12px; }
.section-label { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.thumb-row { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 16px; scrollbar-width: none; }
.thumb-row::-webkit-scrollbar { display: none; }
.thumb { flex-shrink: 0; width: 68px; height: 84px; object-fit: cover; cursor: pointer; opacity: 0.6; transition: opacity 0.15s; }
.thumb:hover { opacity: 1; }
.see-all {
  display: block; margin-bottom: 16px; background: none; border: none;
  color: var(--muted); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  cursor: pointer; font-family: var(--f); padding: 0; transition: color 0.15s;
}
.see-all:hover { color: var(--ink); }

/* BOARDS */
.boards-header { padding: 24px 20px 0; display: flex; align-items: center; justify-content: space-between; }
.boards-title { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
.new-board-btn {
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  background: none; border: 1px solid var(--faint); color: var(--muted);
  padding: 6px 14px; cursor: pointer; font-family: var(--f); transition: all 0.15s;
}
.new-board-btn:hover { border-color: var(--ink); color: var(--ink); }
.boards-grid {
  padding: 16px 20px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
}
.board-card { cursor: pointer; border: 1px solid var(--faint); overflow: hidden; transition: border-color 0.15s; }
.board-card:hover { border-color: var(--muted); }
.board-cover { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; height: 160px; overflow: hidden; }
.board-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.board-cover-empty { height: 160px; background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); }
.board-info { padding: 10px 12px; border-top: 1px solid var(--faint); }
.board-name { font-size: 12px; color: var(--ink); margin-bottom: 2px; }
.board-count { font-size: 10px; color: var(--muted); }
#boardDetail { display: none; }
.board-detail-header {
  padding: 16px 20px; display: flex; align-items: center; gap: 16px;
  border-bottom: 1px solid var(--faint);
}
.back-btn { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: none; border: none; color: var(--muted); cursor: pointer; font-family: var(--f); padding: 0; transition: color 0.15s; }
.back-btn:hover { color: var(--ink); }
.board-detail-name { font-size: 14px; }
.board-delete-btn { margin-left: auto; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; background: none; border: none; color: var(--muted); cursor: pointer; font-family: var(--f); transition: color 0.15s; }
.board-delete-btn:hover { color: #c00; }

/* MODALS */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 600; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: #fff; padding: 28px; width: 92%; max-width: 460px; position: relative; max-height: 90vh; overflow-y: auto; }
.modal-title { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink); margin-bottom: 20px; }
.modal-close { position: absolute; top: 14px; right: 18px; font-size: 20px; background: none; border: none; color: var(--muted); cursor: pointer; line-height: 1; }
.modal-close:hover { color: var(--ink); }
.drop-zone {
  border: 1px dashed var(--faint); padding: 32px 16px; text-align: center;
  cursor: pointer; margin-bottom: 16px; position: relative; transition: border-color 0.2s;
}
.drop-zone:hover, .drop-zone.over { border-color: var(--muted); }
.drop-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.drop-hint { font-size: 11px; color: var(--muted); pointer-events: none; font-style: italic; }
.drop-previews { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.drop-previews img { width: 56px; height: 68px; object-fit: cover; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
.field input {
  width: 100%; border: none; border-bottom: 1px solid var(--faint);
  font-size: 12px; font-family: var(--f); color: var(--ink);
  padding: 5px 0; outline: none; background: transparent; transition: border-color 0.2s;
}
.field input:focus { border-bottom-color: var(--ink); }
.field input::placeholder { color: #ccc; font-style: italic; }
.modal-save {
  width: 100%; background: var(--ink); color: #fff; border: none;
  padding: 12px; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
  font-family: var(--f); cursor: pointer; transition: opacity 0.15s; margin-top: 6px;
}
.modal-save:hover { opacity: 0.8; }
.modal-save:disabled { opacity: 0.3; cursor: default; }
.modal-status { font-size: 11px; color: var(--muted); text-align: center; margin-top: 10px; font-style: italic; min-height: 18px; }
.board-pick-list { max-height: 240px; overflow-y: auto; margin-bottom: 14px; }
.board-pick-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--faint); cursor: pointer; }
.board-pick-name { font-size: 12px; color: var(--muted); transition: color 0.15s; flex: 1; }
.board-pick-item:hover .board-pick-name { color: var(--ink); }
.board-pick-count { font-size: 10px; color: #ccc; }

/* SETTINGS */
#settingsModal .modal { max-width: 380px; }
.setting-note { font-size: 11px; color: var(--muted); font-style: italic; margin-bottom: 16px; line-height: 1.5; }

.scraped-card {
  border: 1px solid var(--faint); padding: 10px 12px; margin-bottom: 8px;
  font-size: 11px; color: var(--muted);
}
.scraped-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.scraped-card-user { font-weight: 500; color: var(--ink); font-size: 11px; }
.scraped-card-caption { color: var(--muted); font-size: 11px; line-height: 1.4; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scraped-card-meta { font-size: 10px; color: #bbb; }
.scraped-card-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.scraped-card-tag { font-size: 9px; padding: 2px 7px; background: var(--chip); color: var(--muted); }
.scraped-card img { width: 48px; height: 56px; object-fit: cover; flex-shrink: 0; }

@media (max-width: 600px) {
  nav { padding: 0 12px; }
  .explore-header { padding: 12px 12px 0; }
  .filter-pills { padding: 10px 12px 0; }
  .grid { padding: 10px 12px; columns: 2 140px; column-gap: 6px; }
  .card { margin-bottom: 6px; }
  .lb-meta { flex-direction: column; gap: 12px; }
  .lb-tags { max-width: 100%; justify-content: flex-start; }
  .boards-grid { grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
}

/* PASSWORD LOCK */
#pwScreen {
  display: none; position: fixed; inset: 0; background: #fff;
  z-index: 9999; align-items: center; justify-content: center;
}
#pwScreen.show { display: flex; }
.pw-box { text-align: center; }
.pw-logo {
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink); margin-bottom: 32px; display: block;
}
#pwInput {
  border: none; border-bottom: 1px solid var(--faint);
  font-size: 14px; font-family: var(--f); color: var(--ink);
  padding: 6px 0; outline: none; background: transparent;
  text-align: center; width: 180px; transition: border-color 0.2s;
  letter-spacing: 0.08em;
}
#pwInput:focus { border-bottom-color: var(--ink); }
#pwInput::placeholder { color: #ccc; font-style: italic; letter-spacing: 0; }
#pwError {
  font-size: 10px; color: #c00; letter-spacing: 0.08em;
  margin-top: 10px; min-height: 14px; opacity: 0; transition: opacity 0.2s;
}
#pwError.show { opacity: 1; }
</style>
</head>
<body>

<!-- PASSWORD SCREEN -->
<div id="pwScreen">
  <div class="pw-box">
    <span class="pw-logo">Lookbook</span>
    <input id="pwInput" type="password" placeholder="password" autocomplete="off" autocorrect="off" autocapitalize="off">
    <div id="pwError">incorrect password</div>
  </div>
</div>

<nav>
  <span class="nav-logo" id="navLogo">Lookbook</span>
  <button class="nav-tab active" id="tabExplore" onclick="showExplore()">Explore</button>
  <button class="nav-tab" id="tabBoards" onclick="showBoards()">Boards</button>
  <button class="nav-add" onclick="openUpload()">+ Add</button>
</nav>

<div id="explorePage">
  <div class="explore-header">
    <input id="searchInput" type="search" placeholder="Search tags, users, vibes…" autocomplete="off">
  </div>
  <div id="filterPills" style="display:none"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">No results</div>
</div>

<div id="boardsPage">
  <div class="boards-header">
    <span class="boards-title">Boards</span>
    <button class="new-board-btn" onclick="createBoard()">+ New Board</button>
  </div>
  <div class="boards-grid" id="boardsGrid"></div>
  <div id="boardDetail">
    <div class="board-detail-header">
      <button class="back-btn" onclick="closeBoard()">← Back</button>
      <span class="board-detail-name" id="boardDetailName"></span>
      <button class="board-delete-btn" onclick="deleteCurrentBoard()">Delete board</button>
    </div>
    <div class="grid" id="boardGrid"></div>
  </div>
</div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <button class="lb-close" onclick="closeLb()">×</button>
  <div class="lb-inner">
    <div class="lb-img-wrap" id="lbImgWrap">
      <img class="lb-img" id="lbImg" src="" alt="">
    </div>
    <div class="lb-meta">
      <div>
        <div class="lb-user" id="lbUser"></div>
        <div class="lb-caption" id="lbCaption"></div>
        <div class="lb-date" id="lbDate"></div>
      </div>
      <div class="lb-tags" id="lbTags"></div>
    </div>
    <div class="lb-notes-wrap">
      <input class="lb-notes" id="lbNotes" placeholder="add a note…" type="text">
    </div>
    <button class="lb-board-btn" onclick="openBoardPicker()">+ Add to board</button>
    <div class="lb-section" id="lbSetSection" style="display:none">
      <div class="section-label">Series</div>
      <div class="thumb-row" id="lbSetStrip"></div>
    </div>
    <div class="lb-section" id="lbUserSection" style="display:none">
      <div class="section-label" id="lbUserLabel"></div>
      <div class="thumb-row" id="lbUserStrip"></div>
      <button class="see-all" id="lbSeeAll"></button>
    </div>
    <div class="lb-section" id="lbRelatedSection" style="display:none">
      <div class="section-label">Related</div>
      <div class="thumb-row" id="lbRelatedStrip"></div>
    </div>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal-bg" id="uploadModal">
  <div class="modal">
    <div class="modal-title">Add to Lookbook</div>
    <button class="modal-close" onclick="closeUpload()">×</button>
    <div class="drop-zone" id="dropZone">
      <input type="file" id="fileInput" accept="image/*" multiple>
      <div class="drop-hint">Tap to choose photos · drag & drop</div>
    </div>
    <div class="drop-previews" id="dropPreviews"></div>
    <div id="scrapedResults" style="display:none">
      <div class="modal-status" id="scrapeStatus" style="text-align:left;margin-bottom:12px;"></div>
      <div id="scrapedCards"></div>
    </div>
    <div id="manualFields">
      <div class="field"><label>@username / source <span style="text-transform:none;letter-spacing:0;font-style:italic">(optional if screenshots)</span></label><input id="upUser" type="text" placeholder="e.g. kothoffline"></div>
      <div class="field"><label>Extra tags <span style="text-transform:none;letter-spacing:0;font-style:italic">(comma separated)</span></label><input id="upTags" type="text" placeholder="outdoor, red, editorial"></div>
    </div>
    <button class="modal-save" id="saveBtn" disabled onclick="saveUpload()">Save</button>
    <div class="modal-status" id="uploadStatus"></div>
  </div>
</div>

<!-- BOARD PICKER -->
<div class="modal-bg" id="boardPickerModal">
  <div class="modal" style="max-width:320px">
    <div class="modal-title">Add to Board</div>
    <button class="modal-close" onclick="document.getElementById('boardPickerModal').classList.remove('open')">×</button>
    <div class="board-pick-list" id="boardPickList"></div>
    <button class="modal-save" onclick="createBoardFromPicker()">+ Create new board</button>
  </div>
</div>

<!-- SETTINGS -->
<div class="modal-bg" id="settingsModal">
  <div class="modal" id="settingsModalInner">
    <div class="modal-title">Settings</div>
    <button class="modal-close" onclick="document.getElementById('settingsModal').classList.remove('open')">×</button>
    <p class="setting-note">Enter your GitHub token to enable cross-device photo uploads. Optionally add a Gemini key for auto-tagging.</p>
    <div class="field"><label>GitHub Token</label><input id="ghTokenInput" type="password" placeholder="ghp_…"></div>
    <div class="field"><label>Gemini API Key (optional)</label><input id="geminiInput" type="password" placeholder="AIza…"></div>
    <button class="modal-save" onclick="saveSettings()">Save</button>
    <div class="modal-status" id="settingsStatus"></div>
  </div>
</div>

let activeUser = 'all', activeSearch = '', currentId = null, currentBoardId = null;

function getAllPosts() {
  const uploads = JSON.parse(localStorage.getItem('lb_uploads') || '[]');
  return [...SEED_POSTS, ...uploads];
}
function getUploads() { return JSON.parse(localStorage.getItem('lb_uploads') || '[]'); }
function saveUploads(u) { localStorage.setItem('lb_uploads', JSON.stringify(u)); }
function getBoards() { return JSON.parse(localStorage.getItem('lb_boards') || '[]'); }
function saveBoards(b) { localStorage.setItem('lb_boards', JSON.stringify(b)); }

// NAV
function showExplore() {
  document.getElementById('explorePage').style.display = '';
  document.getElementById('boardsPage').style.display = 'none';
  document.getElementById('tabExplore').classList.add('active');
  document.getElementById('tabBoards').classList.remove('active');
}
function showBoards() {
  document.getElementById('explorePage').style.display = 'none';
  document.getElementById('boardsPage').style.display = '';
  document.getElementById('boardDetail').style.display = 'none';
  document.getElementById('boardsGrid').style.display = '';
  document.getElementById('tabExplore').classList.remove('active');
  document.getElementById('tabBoards').classList.add('active');
  renderBoards();
}

// PILLS
function buildPills() {
  const users = [...new Set(getAllPosts().map(function(p) { return p.username; }))].sort();
  const el = document.getElementById('filterPills');
  el.innerHTML = '<button class="pill active" data-user="all" onclick="setUser(\'all\')">All</button>';
  users.forEach(function(u) {
    const b = document.createElement('button');
    b.className = 'pill';
    b.dataset.user = u;
    b.textContent = '@' + u;
    b.onclick = function() { setUser(u); };
    el.appendChild(b);
  });
}
function setUser(u) {
  activeUser = u;
  document.querySelectorAll('.pill').forEach(function(p) {
    p.classList.toggle('active', p.dataset.user === u);
  });
  renderGrid();
}

// SEARCH
var searchTimer;
document.getElementById('searchInput').addEventListener('input', function(e) {
  clearTimeout(searchTimer);
  activeSearch = e.target.value.toLowerCase().trim();
  searchTimer = setTimeout(renderGrid, 120);
});

function match(p, term) {
  var hay = [p.username, p.caption || ''].concat(p.hashtags || []).concat(p.visual_tags || []).join(' ').toLowerCase();
  return term.split(/\s+/).every(function(t) { return hay.indexOf(t) >= 0; });
}
function getFiltered() {
  return getAllPosts().filter(function(p) {
    if (activeUser !== 'all' && p.username !== activeUser) return false;
    return !activeSearch || match(p, activeSearch);
  });
}

// GRID
function renderGrid() {
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var filtered = getFiltered();
  grid.innerHTML = '';
  empty.classList.toggle('show', filtered.length === 0);
  filtered.forEach(function(p) { grid.appendChild(makeCard(p, function() { openLb(p.id); })); });
}

function makeCard(post, onClick) {
  var card = document.createElement('div');
  card.className = 'card';
  var img = document.createElement('img');
  img.src = post.image || '';
  img.alt = '';
  img.loading = 'lazy';
  card.appendChild(img);
  if (post.censor_boxes && post.censor_boxes.length) {
    post.censor_boxes.forEach(function(box) {
      var cb = document.createElement('div');
      cb.style.cssText = 'position:absolute;left:' + box.x + '%;top:' + box.y + '%;width:' + box.w + '%;height:' + box.h + '%;background:#000;cursor:pointer;transition:opacity 0.2s;';
      cb.addEventListener('click', function(e) { e.stopPropagation(); cb.style.opacity = cb.style.opacity === '0' ? '1' : '0'; });
      card.appendChild(cb);
    });
  }
  var label = document.createElement('div');
  label.className = 'card-label';
  label.textContent = post.username + (post.caption ? ' · ' + post.caption : '');
  card.appendChild(label);
  card.addEventListener('click', onClick);
  return card;
}

// LIGHTBOX
function openLb(id) {
  var post = getAllPosts().find(function(p) { return p.id === id; });
  if (!post) return;
  currentId = id;

  document.getElementById('lbImg').src = post.image || '';
  document.querySelectorAll('.lb-censor').forEach(function(el) { el.remove(); });
  if (post.censor_boxes) {
    post.censor_boxes.forEach(function(box) {
      var cb = document.createElement('div');
      cb.className = 'lb-censor';
      cb.style.cssText = 'position:absolute;left:' + box.x + '%;top:' + box.y + '%;width:' + box.w + '%;height:' + box.h + '%;background:#000;cursor:pointer;z-index:5;';
      cb.addEventListener('click', function() { cb.style.opacity = cb.style.opacity === '0' ? '1' : '0'; });
      document.getElementById('lbImgWrap').appendChild(cb);
    });
  }

  var userEl = document.getElementById('lbUser');
  userEl.textContent = '@' + post.username;
  userEl.onclick = function() { closeLb(); setUser(post.username); };
  document.getElementById('lbCaption').textContent = post.caption || '';
  document.getElementById('lbDate').textContent = (post.post_date || '').toUpperCase();

  var tagsEl = document.getElementById('lbTags');
  tagsEl.innerHTML = '';
  var allTags = (post.visual_tags || []).concat(post.hashtags || []).slice(0, 12);
  allTags.forEach(function(tag) {
    var b = document.createElement('button');
    b.className = 'lb-tag';
    b.textContent = tag;
    b.onclick = function() {
      closeLb();
      document.getElementById('searchInput').value = tag;
      activeSearch = tag.toLowerCase();
      setUser('all');
      renderGrid();
    };
    tagsEl.appendChild(b);
  });

  var notesEl = document.getElementById('lbNotes');
  notesEl.value = post.notes || '';
  notesEl.onchange = function() {
    var uploads = getUploads();
    var idx = uploads.findIndex(function(p) { return p.id === id; });
    if (idx >= 0) { uploads[idx].notes = notesEl.value; saveUploads(uploads); }
    else {
      var s = SEED_POSTS.find(function(p) { return p.id === id; });
      if (s) s.notes = notesEl.value;
    }
  };

  var setSection = document.getElementById('lbSetSection');
  var setStrip = document.getElementById('lbSetStrip');
  setStrip.innerHTML = '';
  var members = (post.set_members || []).filter(function(m) { return m !== id; });
  if (members.length) {
    setSection.style.display = '';
    members.forEach(function(mid) {
      var mp = getAllPosts().find(function(p) { return p.id === mid; });
      if (mp) setStrip.appendChild(makeThumb(mp.image, function() { openLb(mid); }));
    });
  } else { setSection.style.display = 'none'; }

  var userSection = document.getElementById('lbUserSection');
  var userStrip = document.getElementById('lbUserStrip');
  userStrip.innerHTML = '';
  var byUser = getAllPosts().filter(function(p) { return p.username === post.username && p.id !== id; });
  if (byUser.length) {
    userSection.style.display = '';
    document.getElementById('lbUserLabel').textContent = 'More from @' + post.username;
    byUser.slice(0, 10).forEach(function(p) { userStrip.appendChild(makeThumb(p.image, function() { openLb(p.id); })); });
    var sa = document.getElementById('lbSeeAll');
    sa.textContent = byUser.length > 10 ? 'View all ' + byUser.length + ' from @' + post.username + ' →' : '';
    sa.onclick = function() { closeLb(); setUser(post.username); };
  } else { userSection.style.display = 'none'; }

  // Related photos — posts sharing visual tags
  var relatedSection = document.getElementById('lbRelatedSection');
  var relatedStrip = document.getElementById('lbRelatedStrip');
  relatedStrip.innerHTML = '';
  var postTags = (post.visual_tags || []).map(function(t) { return t.toLowerCase(); });
  var related = getAllPosts().filter(function(p) {
    if (p.id === id) return false;
    var pTags = (p.visual_tags || []).map(function(t) { return t.toLowerCase(); });
    return postTags.some(function(t) { return pTags.indexOf(t) >= 0; });
  });
  related.sort(function(a, b) {
    var aTags = (a.visual_tags || []).map(function(t) { return t.toLowerCase(); });
    var bTags = (b.visual_tags || []).map(function(t) { return t.toLowerCase(); });
    var aMatch = postTags.filter(function(t) { return aTags.indexOf(t) >= 0; }).length;
    var bMatch = postTags.filter(function(t) { return bTags.indexOf(t) >= 0; }).length;
    return bMatch - aMatch;
  });
  if (related.length) {
    relatedSection.style.display = '';
    related.slice(0, 12).forEach(function(p) { relatedStrip.appendChild(makeThumb(p.image, function() { openLb(p.id); })); });
  } else { relatedSection.style.display = 'none'; }

  document.getElementById('lb').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function makeThumb(src, onClick) {
  var img = document.createElement('img');
  img.className = 'thumb';
  img.src = src || '';
  img.alt = '';
  img.addEventListener('click', onClick);
  return img;
}
function closeLb() {
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow = '';
  currentId = null;
}
document.getElementById('lb').addEventListener('click', function(e) { if (e.target.id === 'lb') closeLb(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') { closeLb(); closeUpload(); document.getElementById('settingsModal').classList.remove('open'); } });

// BOARDS
function renderBoards() {
  var boards = getBoards();
  var grid = document.getElementById('boardsGrid');
  grid.innerHTML = '';
  if (!boards.length) {
    grid.innerHTML = '<div style="padding:40px;color:#999;font-size:12px;letter-spacing:0.06em;grid-column:1/-1">No boards yet. Create one to start curating.</div>';
    return;
  }
  boards.forEach(function(board) {
    var card = document.createElement('div');
    card.className = 'board-card';
    card.onclick = function() { openBoard(board.id); };
    var posts = getAllPosts().filter(function(p) { return (board.postIds || []).indexOf(p.id) >= 0; });
    var imgs = posts.slice(0, 4).map(function(p) { return p.image; }).filter(Boolean);
    if (imgs.length) {
      var cover = document.createElement('div');
      cover.className = 'board-cover';
      imgs.forEach(function(src) {
        var img = document.createElement('img');
        img.src = src; img.alt = '';
        cover.appendChild(img);
      });
      card.appendChild(cover);
    } else {
      var empty = document.createElement('div');
      empty.className = 'board-cover-empty';
      empty.textContent = 'empty';
      card.appendChild(empty);
    }
    var info = document.createElement('div');
    info.className = 'board-info';
    info.innerHTML = '<div class="board-name">' + board.name + '</div><div class="board-count">' + posts.length + ' image' + (posts.length !== 1 ? 's' : '') + '</div>';
    card.appendChild(info);
    grid.appendChild(card);
  });
}
function createBoard() {
  var name = prompt('Board name:');
  if (!name || !name.trim()) return;
  var boards = getBoards();
  boards.push({ id: Date.now().toString(), name: name.trim(), postIds: [] });
  saveBoards(boards);
  renderBoards();
}
function openBoard(id) {
  currentBoardId = id;
  var board = getBoards().find(function(b) { return b.id === id; });
  if (!board) return;
  document.getElementById('boardsGrid').style.display = 'none';
  document.getElementById('boardDetail').style.display = '';
  document.getElementById('boardDetailName').textContent = board.name;
  var posts = getAllPosts().filter(function(p) { return (board.postIds || []).indexOf(p.id) >= 0; });
  var grid = document.getElementById('boardGrid');
  grid.innerHTML = '';
  posts.forEach(function(p) { grid.appendChild(makeCard(p, function() { openLb(p.id); })); });
}
function closeBoard() {
  currentBoardId = null;
  document.getElementById('boardDetail').style.display = 'none';
  document.getElementById('boardsGrid').style.display = '';
  renderBoards();
}
function deleteCurrentBoard() {
  if (!currentBoardId || !confirm('Delete this board?')) return;
  saveBoards(getBoards().filter(function(b) { return b.id !== currentBoardId; }));
  closeBoard();
}

// BOARD PICKER
function openBoardPicker() {
  var modal = document.getElementById('boardPickerModal');
  var list = document.getElementById('boardPickList');
  var boards = getBoards();
  list.innerHTML = '';
  if (!boards.length) {
    list.innerHTML = '<div style="padding:16px 0;color:#999;font-size:12px;">No boards yet.</div>';
  } else {
    boards.forEach(function(board) {
      var item = document.createElement('div');
      item.className = 'board-pick-item';
      item.innerHTML = '<span class="board-pick-name">' + board.name + '</span><span class="board-pick-count">' + (board.postIds || []).length + '</span>';
      item.onclick = function() {
        if (currentId && (board.postIds || []).indexOf(currentId) < 0) {
          board.postIds = board.postIds || [];
          board.postIds.push(currentId);
          saveBoards(boards);
        }
        modal.classList.remove('open');
      };
      list.appendChild(item);
    });
  }
  modal.classList.add('open');
}
function createBoardFromPicker() {
  var name = prompt('Board name:');
  if (!name || !name.trim()) return;
  var boards = getBoards();
  boards.push({ id: Date.now().toString(), name: name.trim(), postIds: currentId ? [currentId] : [] });
  saveBoards(boards);
  document.getElementById('boardPickerModal').classList.remove('open');
}

// Detect if image is a social media screenshot and crop out the UI
function cropScreenshot(file) {
  return new Promise(function(resolve) {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function() {
      var w = img.width, h = img.height;
      var isScreenshot = (h / w) > 1.5;
      if (!isScreenshot) { resolve(file); URL.revokeObjectURL(url); return; }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var data = ctx.getImageData(0, 0, w, h).data;
      function isDark(y, threshold) {
        var count = 0;
        for (var x = Math.floor(w*0.1); x < Math.floor(w*0.9); x += Math.floor(w*0.2)) {
          var i = (y * w + x) * 4;
          if ((data[i] + data[i+1] + data[i+2]) / 3 < threshold) count++;
        }
        return count >= 3;
      }
      var topCrop = Math.floor(h * 0.08);
      for (var y = Math.floor(h * 0.05); y < Math.floor(h * 0.35); y++) {
        if (!isDark(y, 60) && isDark(y - 1, 60)) { topCrop = y; break; }
      }
      var bottomCrop = Math.floor(h * 0.88);
      for (var y2 = Math.floor(h * 0.88); y2 > Math.floor(h * 0.5); y2--) {
        if (!isDark(y2, 60) && isDark(y2 + 1, 60)) { bottomCrop = y2; break; }
      }
      var cropH = bottomCrop - topCrop;
      if (cropH < h * 0.3) { resolve(file); URL.revokeObjectURL(url); return; }
      var out = document.createElement('canvas');
      out.width = w; out.height = cropH;
      out.getContext('2d').drawImage(img, 0, topCrop, w, cropH, 0, 0, w, cropH);
      URL.revokeObjectURL(url);
      out.toBlob(function(blob) {
        resolve(new File([blob], file.name, { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.92);
    };
    img.src = url;
  });
}

// Scrape post info from screenshot using Gemini
async function scrapePostInfo(file, b64) {
  var geminiKey = getGeminiKey();
  if (!geminiKey) return null;
  try {
    var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + geminiKey, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ contents: [{ parts: [
        { text: 'This is a social media screenshot. Extract the post information and return ONLY a JSON object with these fields: {"username": "@handle or null", "caption": "post caption text or null", "date": "date string or null", "is_social_screenshot": true/false, "visual_tags": ["tag1","tag2",...8-12 descriptive tags about the visual content: colors, clothing, mood, setting, style]}. No explanation, just JSON.' },
        { inline_data: { mime_type: file.type || 'image/jpeg', data: b64 } }
      ]}]})
    });
    var data = await res.json();
    var txt = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts && data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text) || '';
    var match = txt.match(/\{[\s\S]*\}/);
    if (match) return JSON.parse(match[0]);
  } catch(e) { console.log('Gemini scrape error', e); }
  return null;
}

var pendingFiles = [];
var scrapedData = []; // per-file scraped info

function fileToB64(file) {
  return new Promise(function(res, rej) {
    var r = new FileReader();
    r.onload = function() { res(r.result.split(',')[1]); };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function handleFiles(files) {
  var raw = Array.from(files).filter(function(f) { return f.type.indexOf('image/') === 0; });
  scrapedData = [];
  var prev = document.getElementById('dropPreviews');
  prev.innerHTML = '';
  document.getElementById('saveBtn').disabled = true;
  document.getElementById('scrapedResults').style.display = 'none';
  document.getElementById('scrapedCards').innerHTML = '';
  document.getElementById('scrapeStatus').textContent = 'Checking for duplicates…';
  document.getElementById('scrapedResults').style.display = '';

  Promise.all(raw.map(isDuplicate)).then(function(dupeFlags) {
    var skipped = dupeFlags.filter(Boolean).length;
    pendingFiles = raw.filter(function(_, i) { return !dupeFlags[i]; });
    if (!pendingFiles.length) {
      document.getElementById('scrapeStatus').textContent = skipped + ' duplicate' + (skipped > 1 ? 's' : '') + ' skipped — nothing new to add.';
      return;
    }
    if (skipped > 0) document.getElementById('scrapeStatus').textContent = skipped + ' duplicate' + (skipped > 1 ? 's' : '') + ' skipped.';
    else document.getElementById('scrapeStatus').textContent = '';

    pendingFiles.forEach(function(f) {
      var img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      prev.appendChild(img);
    });
    document.getElementById('saveBtn').disabled = false;

    var geminiKey = getGeminiKey();

    // Step 1: crop all in parallel
    document.getElementById('scrapeStatus').textContent = (skipped ? skipped + ' dupes skipped · ' : '') + 'Cropping…';
    Promise.all(pendingFiles.map(function(f) { return fileToB64(f); })).then(function(origB64s) {
      return Promise.all(pendingFiles.map(function(f, i) {
        return cropScreenshot(f).then(function(cropped) {
          pendingFiles[i] = cropped;
          prev.children[i] && (prev.children[i].src = URL.createObjectURL(cropped));
          return origB64s[i]; // use original b64 for scraping (full screenshot has more UI context)
        });
      }));
    }).then(function(b64s) {
      if (!geminiKey) {
        document.getElementById('scrapedResults').style.display = 'none';
        return;
      }
      // Step 2: scrape ALL in parallel
      document.getElementById('scrapeStatus').textContent = 'Reading post info…';
      document.getElementById('scrapedResults').style.display = '';
      return Promise.all(pendingFiles.map(function(f, i) {
        return scrapePostInfo(f, b64s[i]).then(function(info) {
          scrapedData[i] = info;
          return info;
        });
      }));
    }).then(function(infos) {
      if (!infos) return;
      document.getElementById('scrapeStatus').textContent = pendingFiles.length + ' photo' + (pendingFiles.length > 1 ? 's' : '') + ' ready';
      var cards = document.getElementById('scrapedCards');
      cards.innerHTML = '';
      pendingFiles.forEach(function(f, i) {
        var info = scrapedData[i] || {};
        var card = document.createElement('div');
        card.className = 'scraped-card';
        var row = document.createElement('div');
        row.style.cssText = 'display:flex;gap:10px;align-items:flex-start;';
        var thumb = document.createElement('img');
        thumb.src = URL.createObjectURL(f);
        row.appendChild(thumb);
        var meta = document.createElement('div');
        meta.style.cssText = 'flex:1;min-width:0;';
        meta.innerHTML = '<div class="scraped-card-header"><span class="scraped-card-user">' + (info.username || 'unknown') + '</span></div>' +
          '<div class="scraped-card-caption">' + (info.caption || '') + '</div>' +
          '<div class="scraped-card-meta">' + (info.date || '') + '</div>';
        if (info.visual_tags && info.visual_tags.length) {
          var tagDiv = document.createElement('div');
          tagDiv.className = 'scraped-card-tags';
          info.visual_tags.forEach(function(t) {
            var span = document.createElement('span');
            span.className = 'scraped-card-tag';
            span.textContent = t;
            tagDiv.appendChild(span);
          });
          meta.appendChild(tagDiv);
        }
        row.appendChild(meta);
        card.appendChild(row);
        cards.appendChild(card);
      });
    });
  });
}

      document.body.style.overflow = '';
    } else {
      error.classList.add('show');
      input.value = '';
      setTimeout(function() { error.classList.remove('show'); }, 1800);
    }
  });
})();
